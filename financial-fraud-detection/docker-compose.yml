services:
  triton:
    build: ./docker/triton
    image: ffd-triton:latest
    container_name: ffd-triton
    restart: unless-stopped
    command: >
      tritonserver --model-repository=/models
      --allow-http=true --allow-grpc=true --allow-metrics=true
    ports:
      - "${TRITON_HTTP_PORT:-8000}:8000"
      - "${TRITON_GRPC_PORT:-8001}:8001"
      - "${TRITON_METRICS_PORT:-8002}:8002"
    volumes:
      - ./models:/models:ro
      - ./cache/nvcache:/nvcache
    environment:
      CUDA_CACHE_PATH: /nvcache
      CUDA_CACHE_MAXSIZE: "4294967296"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET /v2/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  demo:
    build: ./docker/demo
    image: ffd-demo:latest
    container_name: ffd-demo
    restart: unless-stopped
    depends_on:
      triton:
        condition: service_healthy
    ports:
      - "${DEMO_PORT:-8090}:8090"
    volumes:
      - ./app:/app:ro
      - ./data:/data:ro
      - ./services:/svc:ro
      - ../brand:/brand:ro
      - ./cache/nvcache:/nvcache
    environment:
      TRITON_URL: "triton:8000"
      GNN_TEST_DIR: /data/TabFormer/gnn_np/test_gnn
      BRAND_DIR: /brand
      PORT: "8090"
      HERO_N: "${HERO_N:-12}"
      BROKER: "redpanda:9092"
      FEED_SOURCE: "${FEED_SOURCE:-file}"
      CUDA_CACHE_PATH: /nvcache
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8090 && echo -e 'GET /api/stats HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # --- v2 streaming pipeline (stage 1) --------------------------------------
  # Redpanda, not Apache Kafka: single binary, no ZooKeeper/KRaft ceremony,
  # native arm64, far smaller on a desktop box. It speaks the Kafka API, so the
  # clients are stock confluent-kafka. Call it a "Kafka-compatible event
  # stream" in the narrative - it is not Apache Kafka.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: ffd-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --node-id=0
      - --smp=2
      - --memory=2G
      - --overprovisioned
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "${BROKER_PORT:-19092}:19092"   # host access for rpk / debugging
      - "${BROKER_ADMIN_PORT:-19644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD","rpk","cluster","health","-X","brokers=localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Topics are created explicitly rather than auto-created, so partition counts
  # and retention are declared and reviewable. Partitioned by card/account id,
  # which is what preserves per-entity ordering; 6 partitions gives parallelism
  # headroom on this box without splitting a single card across partitions.
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: ffd-redpanda-init
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash","-c"]
    command:
      - |
        set -e
        R="-X brokers=redpanda:9092"
        rpk topic create txn.raw          $$R -p 6 -c retention.ms=3600000    || true
        rpk topic create txn.truth        $$R -p 6 -c retention.ms=3600000    || true
        rpk topic create txn.scored       $$R -p 6 -c retention.ms=21600000   || true
        rpk topic create screening.alerts $$R -p 3 -c retention.ms=86400000   || true
        rpk topic create alerts.ranked    $$R -p 3 -c retention.ms=86400000   || true
        rpk topic create case.events      $$R -p 3 -c retention.ms=604800000  || true
        rpk topic list $$R

  txn-generator:
    build: ./docker/svc
    image: ffd-svc:latest
    container_name: ffd-txn-generator
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["/svc/txn_generator/generator.py"]
    ports:
      - "${GEN_PORT:-8091}:8091"
    volumes:
      - ./services:/svc:ro
      - ./data:/data:ro          # full test set: this service needs the labels
    environment:
      BROKER: "redpanda:9092"
      GNN_TEST_DIR: /data/TabFormer/gnn_np/test_gnn
      PORT: "8091"
      RATE: "${GEN_RATE:-400}"
      MODE: "${GEN_MODE:-demo}"
      SEED: "${GEN_SEED:-20260920}"
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8091 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Label isolation is enforced by the mount list, not by convention: only the
  # feature and mask CSVs are mounted. transaction_label.csv and
  # transaction_display.csv are absent from this container's filesystem, so the
  # scoring path cannot read ground truth even if the code tried to. The
  # service asserts this at startup.
  scoring-svc:
    build: ./docker/svc
    image: ffd-svc:latest
    container_name: ffd-scoring-svc
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      triton:
        condition: service_healthy
    command: ["/svc/scoring_svc/scoring.py"]
    ports:
      - "${SCORE_PORT:-8092}:8092"
    volumes:
      - ./services:/svc:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/user.csv:/feat/nodes/user.csv:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/transaction.csv:/feat/nodes/transaction.csv:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/merchant.csv:/feat/nodes/merchant.csv:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/user_feature_mask.csv:/feat/nodes/user_feature_mask.csv:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/transaction_feature_mask.csv:/feat/nodes/transaction_feature_mask.csv:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/merchant_feature_mask.csv:/feat/nodes/merchant_feature_mask.csv:ro
      - ./cache/nvcache:/nvcache
    environment:
      BROKER: "redpanda:9092"
      TRITON_URL: "triton:8000"
      GNN_TEST_DIR: /feat
      PORT: "8092"
      BATCH_MAX: "${BATCH_MAX:-256}"
      BATCH_WAIT_MS: "${BATCH_WAIT_MS:-40}"
      CUDA_CACHE_PATH: /nvcache
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8092 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  redpanda-data:
