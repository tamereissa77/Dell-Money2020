services:
  triton:
    build: ./docker/triton
    image: ffd-triton:latest
    container_name: ffd-triton
    restart: unless-stopped
    command: >
      tritonserver --model-repository=/models
      --allow-http=true --allow-grpc=true --allow-metrics=true
    ports:
      - "${TRITON_HTTP_PORT:-8000}:8000"
      - "${TRITON_GRPC_PORT:-8001}:8001"
      - "${TRITON_METRICS_PORT:-8002}:8002"
    volumes:
      - ./models:/models:ro
      - ./cache/nvcache:/nvcache
    environment:
      CUDA_CACHE_PATH: /nvcache
      CUDA_CACHE_MAXSIZE: "4294967296"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET /v2/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  demo:
    build: ./docker/demo
    image: ffd-demo:latest
    container_name: ffd-demo
    restart: unless-stopped
    depends_on:
      triton:
        condition: service_healthy
    ports:
      - "${DEMO_PORT:-8090}:8090"
    volumes:
      - ./app:/app:ro
      - ./data:/data:ro
      - ./services:/svc:ro
      - ../brand:/brand:ro
      - ./cache/nvcache:/nvcache
    environment:
      TRITON_URL: "triton:8000"
      GNN_TEST_DIR: /data/TabFormer/gnn_np/test_gnn
      BRAND_DIR: /brand
      PORT: "8090"
      HERO_N: "${HERO_N:-12}"
      BROKER: "redpanda:9092"
      FEED_SOURCE: "${FEED_SOURCE:-file}"
      ALERT_URL: "http://alert-svc:8094"
      AUDIT_URL: "http://audit-svc:8095"
      SCREEN_URL: "http://screening-stub:8093"
      GEN_URL: "http://txn-generator:8091"
      CUDA_CACHE_PATH: /nvcache
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8090 && echo -e 'GET /api/stats HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # --- v2 streaming pipeline (stage 1) --------------------------------------
  # Redpanda, not Apache Kafka: single binary, no ZooKeeper/KRaft ceremony,
  # native arm64, far smaller on a desktop box. It speaks the Kafka API, so the
  # clients are stock confluent-kafka. Call it a "Kafka-compatible event
  # stream" in the narrative - it is not Apache Kafka.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: ffd-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --node-id=0
      - --smp=2
      - --memory=2G
      - --overprovisioned
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "${BROKER_PORT:-19092}:19092"   # host access for rpk / debugging
      - "${BROKER_ADMIN_PORT:-19644}:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD","rpk","cluster","health","-X","brokers=localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # Topics are created explicitly rather than auto-created, so partition counts
  # and retention are declared and reviewable. Partitioned by card/account id,
  # which is what preserves per-entity ordering; 6 partitions gives parallelism
  # headroom on this box without splitting a single card across partitions.
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: ffd-redpanda-init
    restart: "no"
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash","-c"]
    command:
      - |
        set -e
        R="-X brokers=redpanda:9092"
        rpk topic create txn.raw          $$R -p 6 -c retention.ms=3600000    || true
        rpk topic create txn.truth        $$R -p 6 -c retention.ms=3600000    || true
        rpk topic create txn.scored       $$R -p 6 -c retention.ms=21600000   || true
        rpk topic create screening.alerts $$R -p 3 -c retention.ms=86400000   || true
        rpk topic create alerts.ranked    $$R -p 3 -c retention.ms=86400000   || true
        rpk topic create case.events      $$R -p 3 -c retention.ms=604800000  || true
        rpk topic list $$R

  txn-generator:
    build: ./docker/svc
    image: ffd-svc:latest
    container_name: ffd-txn-generator
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["/svc/txn_generator/generator.py"]
    ports:
      - "${GEN_PORT:-8091}:8091"
    volumes:
      - ./services:/svc:ro
      - ./data:/data:ro          # full test set: this service needs the labels
    environment:
      BROKER: "redpanda:9092"
      GNN_TEST_DIR: /data/TabFormer/gnn_np/test_gnn
      PORT: "8091"
      RATE: "${GEN_RATE:-400}"
      MODE: "${GEN_MODE:-demo}"
      SEED: "${GEN_SEED:-20260920}"
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8091 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Label isolation is enforced by the mount list, not by convention: only the
  # feature and mask CSVs are mounted. transaction_label.csv and
  # transaction_display.csv are absent from this container's filesystem, so the
  # scoring path cannot read ground truth even if the code tried to. The
  # service asserts this at startup.
  scoring-svc:
    build: ./docker/svc
    image: ffd-svc:latest
    container_name: ffd-scoring-svc
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
      triton:
        condition: service_healthy
    command: ["/svc/scoring_svc/scoring.py"]
    ports:
      - "${SCORE_PORT:-8092}:8092"
    volumes:
      - ./services:/svc:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/user.csv:/feat/nodes/user.csv:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/transaction.csv:/feat/nodes/transaction.csv:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/merchant.csv:/feat/nodes/merchant.csv:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/user_feature_mask.csv:/feat/nodes/user_feature_mask.csv:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/transaction_feature_mask.csv:/feat/nodes/transaction_feature_mask.csv:ro
      - ./data/TabFormer/gnn_np/test_gnn/nodes/merchant_feature_mask.csv:/feat/nodes/merchant_feature_mask.csv:ro
      - ./cache/nvcache:/nvcache
    environment:
      BROKER: "redpanda:9092"
      TRITON_URL: "triton:8000"
      GNN_TEST_DIR: /feat
      PORT: "8092"
      BATCH_MAX: "${BATCH_MAX:-256}"
      BATCH_WAIT_MS: "${BATCH_WAIT_MS:-40}"
      CUDA_CACHE_PATH: /nvcache
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8092 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # --- stage 2: the incumbent, and the re-ranking that augments it ----------
  # screening-stub consumes txn.raw directly. It never sees a model score and
  # nothing upstream can disable it: the model does not write to
  # screening.alerts, and alert-svc only reorders what this service raises.
  screening-stub:
    build: ./docker/svc
    image: ffd-svc:latest
    container_name: ffd-screening-stub
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["/svc/screening_stub/screening.py"]
    ports:
      - "${SCREEN_PORT:-8093}:8093"
    volumes:
      - ./services:/svc:ro
    environment:
      BROKER: "redpanda:9092"
      PORT: "8093"
      RULE_AMOUNT: "${RULE_AMOUNT:-500}"
      RULE_VELOCITY_COUNT: "${RULE_VELOCITY_COUNT:-12}"
      RULE_VELOCITY_WINDOW: "${RULE_VELOCITY_WINDOW:-30}"
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8093 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  alert-svc:
    build: ./docker/svc
    image: ffd-svc:latest
    container_name: ffd-alert-svc
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["/svc/alert_svc/alerts.py"]
    ports:
      - "${ALERT_PORT:-8094}:8094"
    volumes:
      - ./services:/svc:ro
      - alert-state:/state
    environment:
      BROKER: "redpanda:9092"
      PORT: "8094"
      ALERT_DB: /state/alerts.db
      SUPPRESS_ENABLED: "${SUPPRESS_ENABLED:-1}"
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8094 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # --- stage 3: the audit trail --------------------------------------------
  # Append-only by construction: records arrive ONLY from the case.events
  # topic. There is no HTTP route that writes one, so nothing can be inserted
  # out of band - not even by this service's own API.
  audit-svc:
    build: ./docker/svc
    image: ffd-svc:latest
    container_name: ffd-audit-svc
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["/svc/audit_svc/audit.py"]
    ports:
      - "${AUDIT_PORT:-8095}:8095"
    volumes:
      - ./services:/svc:ro
      - audit-state:/state
    environment:
      BROKER: "redpanda:9092"
      PORT: "8095"
      AUDIT_DB: /state/audit.db
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8095 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # --- stage 4: investigator's draft narrative ------------------------------
  # Template narrator only for now. LLM_URL is deliberately empty: the brief
  # makes the deterministic path mandatory so the demo is never one model
  # download away from failing on the booth floor.
  copilot-svc:
    build: ./docker/svc
    image: ffd-svc:latest
    container_name: ffd-copilot-svc
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    command: ["/svc/copilot_svc/copilot.py"]
    ports:
      - "${COPILOT_PORT:-8096}:8096"
    volumes:
      - ./services:/svc:ro
      - ./data/policy:/policy:ro
    environment:
      BROKER: "redpanda:9092"
      PORT: "8096"
      POLICY_DIR: /policy
      ALERT_URL: "http://alert-svc:8094"
      DEMO_URL: "http://demo:8090"
      LLM_URL: "${COPILOT_LLM_URL:-http://copilot-llm:8000}"
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8096 && echo -e 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # --- stage 4: the copilot's own LLM ---------------------------------------
  # The same vLLM container VSS runs, but owned by THIS compose project, so the
  # launcher's one-demo-at-a-time rule never stops it and the fraud demo stays
  # self-contained. Only the model server is needed - none of VSS's VIOS,
  # haproxy, postgres or redis.
  #
  # The two volumes below are VSS's, declared external and mounted read-write:
  # the 9B weights are already downloaded there, so this starts warm instead of
  # pulling the model again. Nothing here writes to them in normal operation.
  copilot-llm:
    image: nvcr.io/nvidia/vllm:25.12.post1-py3
    container_name: ffd-copilot-llm
    restart: unless-stopped
    ports:
      - "${COPILOT_LLM_PORT:-8097}:8000"
    volumes:
      - nemotron-cache:/opt/nim/.cache
      - ./cache/nvcache:/nvcache
    environment:
      CUDA_CACHE_PATH: /nvcache
    command:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
      - --model=nvidia/NVIDIA-Nemotron-Nano-9B-v2-FP8
      - --trust-remote-code
      - --tensor-parallel-size=1
      # 0.18 of 121 GB is ~22 GB, matching what VSS allocates it. Triton and the
      # pipeline together use well under 3 GB, so this fits with room to spare.
      - --gpu-memory-utilization=0.18
      - --max-model-len=16384
      - --mamba_ssm_cache_dtype=float32
      - --port=8000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET /v1/models HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

volumes:
  redpanda-data:
  alert-state:
  audit-state:
  # VSS already downloaded these weights; reuse rather than pull 9B again.
  nemotron-cache:
    external: true
    name: mdx_nvidia_nemotron_nano_9b_v2_fp8_cache
