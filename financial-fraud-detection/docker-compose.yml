services:
  triton:
    build: ./docker/triton
    image: ffd-triton:latest
    container_name: ffd-triton
    restart: unless-stopped
    command: >
      tritonserver --model-repository=/models
      --allow-http=true --allow-grpc=true --allow-metrics=true
    ports:
      - "${TRITON_HTTP_PORT:-8000}:8000"
      - "${TRITON_GRPC_PORT:-8001}:8001"
      - "${TRITON_METRICS_PORT:-8002}:8002"
    volumes:
      - ./models:/models:ro
      - ./cache/nvcache:/nvcache
    environment:
      CUDA_CACHE_PATH: /nvcache
      CUDA_CACHE_MAXSIZE: "4294967296"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8000 && echo -e 'GET /v2/health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  demo:
    build: ./docker/demo
    image: ffd-demo:latest
    container_name: ffd-demo
    restart: unless-stopped
    depends_on:
      triton:
        condition: service_healthy
    ports:
      - "${DEMO_PORT:-8090}:8090"
    volumes:
      - ./app:/app:ro
      - ./data:/data:ro
      - ./brand:/brand:ro
      - ./cache/nvcache:/nvcache
    environment:
      TRITON_URL: "triton:8000"
      GNN_TEST_DIR: /data/TabFormer/gnn_np/test_gnn
      BRAND_DIR: /brand
      PORT: "8090"
      HERO_N: "${HERO_N:-12}"
      CUDA_CACHE_PATH: /nvcache
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8090 && echo -e 'GET /api/stats HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
