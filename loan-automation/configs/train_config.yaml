# Qwen2.5-VL-7B QLoRA training config. Tuned for a single RTX 5090 (32 GB, Blackwell sm_120).
# Override any field on the CLI: `python -m src.training.train_qwen_vl --config configs/train_config.yaml --lr 5e-5`

model:
  name: "Qwen/Qwen2.5-VL-7B-Instruct"
  attn_implementation: "sdpa"          # FA2 wheels for Blackwell are not stable yet; revisit.
  trust_remote_code: true
  load_in_4bit: true                   # bnb NF4
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 64
  alpha: 128
  dropout: 0.05
  use_rslora: true
  bias: "none"
  task_type: "CAUSAL_LM"
  # LLM transformer blocks. Adding the visual merger gives the model a small
  # adaptation budget on the side of the bridge that matters for OCR.
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  # Set to true to also train the visual merger (mlp1/mlp2 inside model.visual.merger).
  # Off by default — turn on for phase 2 if val plateaus on bbox IoU.
  train_visual_merger: false
  # Always keep the vision tower (patch embed + ViT) frozen for phase 1. The 7B
  # visual is already very capable; LoRA on it eats VRAM and rarely pays off.
  freeze_vision_tower: true

data:
  dataset_dir: "dataset/v1"            # contains train.jsonl, val.jsonl, test.jsonl
  image_root: "."                      # paths in JSONL are resolved relative to this
  min_pixels: 200704                   # 256 * 28 * 28
  max_pixels: 1003520                  # 1280 * 28 * 28
  max_seq_len: 4096

train:
  output_dir: "output/lora/v1"
  num_epochs: 5
  per_device_batch_size: 1
  gradient_accumulation_steps: 16      # effective batch = 16
  learning_rate: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler: "cosine"
  max_grad_norm: 1.0
  gradient_checkpointing: true
  bf16: true
  fp16: false
  tf32: true
  seed: 42
  dataloader_num_workers: 4
  remove_unused_columns: false         # required when passing images through the processor

eval:
  eval_every_steps: 50
  save_every_steps: 50
  save_total_limit: 3
  early_stopping_patience: 4           # in eval-steps, so 4 * 50 = 200 steps without improvement
  metric_for_best_model: "eval_loss"
  greater_is_better: false

logging:
  log_every_steps: 5
  report_to: ["tensorboard"]           # add "wandb" if you set WANDB_API_KEY
  run_name: "qwen25vl-7b-eg-docs-v1"
