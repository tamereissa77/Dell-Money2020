services:
  portfolio:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: portopt-demo:latest
    container_name: portopt-demo
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8501}:8501"
    volumes:
      - ./data:/work/data
      - ./demo:/work/demo:ro
      - ../.nvcache-shared:/nvcache
    environment:
      CUDA_CACHE_PATH: /nvcache
      CUDA_CACHE_MAXSIZE: "4294967296"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: ["CMD","bash","-c","exec 3<>/dev/tcp/localhost/8501 && echo -e 'GET /_stcore/health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
