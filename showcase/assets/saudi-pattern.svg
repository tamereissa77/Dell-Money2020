<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="glow-p" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.8" flood-color="#0076ce" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0076ce" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#00c0a3" stop-opacity="0.4"/>
    </linearGradient>
    <style>
      .p-base {
        fill: none;
        stroke: #0284c7;
        stroke-width: 1.5;
        stroke-opacity: 0.28;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .p-mid {
        fill: none;
        stroke: #38bdf8;
        stroke-width: 1.6;
        stroke-opacity: 0.38;
        stroke-linejoin: round;
        stroke-linecap: round;
        filter: url(#glow-p);
      }
      .p-inner {
        fill: none;
        stroke: #38bdf8;
        stroke-width: 1.3;
        stroke-opacity: 0.48;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .p-emerald {
        fill: none;
        stroke: #00c0a3;
        stroke-width: 1.2;
        stroke-opacity: 0.35;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .p-sub {
        fill: none;
        stroke: #0076ce;
        stroke-width: 1.2;
        stroke-opacity: 0.22;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .p-dot {
        fill: #38bdf8;
        fill-opacity: 0.6;
      }
      .p-dot-green {
        fill: #00c0a3;
        fill-opacity: 0.65;
      }
    </style>
  </defs>

  <!-- ── 1. CENTER CONCENTRIC DIAMOND ── -->
  <polygon class="p-base" points="100,24 176,100 100,176 24,100" />
  <polygon class="p-mid" points="100,38 162,100 100,162 38,100" />
  <polygon class="p-inner" points="100,52 148,100 100,148 52,100" />
  <polygon class="p-emerald" points="100,66 134,100 100,134 66,100" />
  <polygon class="p-mid" points="100,80 120,100 100,120 80,100" />
  <!-- Center Core Motif -->
  <circle class="p-dot" cx="100" cy="100" r="2.5" />
  <circle class="p-dot-green" cx="100" cy="80" r="1.5" />
  <circle class="p-dot-green" cx="100" cy="120" r="1.5" />
  <circle class="p-dot-green" cx="80" cy="100" r="1.5" />
  <circle class="p-dot-green" cx="120" cy="100" r="1.5" />

  <!-- ── 2. FOUR CORNERS (Matching center when tiled) ── -->
  <!-- Top-Left Corner (0,0) -->
  <path class="p-base" d="M 0,76 L 76,0" />
  <path class="p-mid" d="M 0,62 L 62,0" />
  <path class="p-inner" d="M 0,48 L 48,0" />
  <path class="p-emerald" d="M 0,34 L 34,0" />
  <path class="p-mid" d="M 0,20 L 20,0" />
  <circle class="p-dot" cx="0" cy="0" r="2.5" />

  <!-- Top-Right Corner (200,0) -->
  <path class="p-base" d="M 200,76 L 124,0" />
  <path class="p-mid" d="M 200,62 L 138,0" />
  <path class="p-inner" d="M 200,48 L 152,0" />
  <path class="p-emerald" d="M 200,34 L 166,0" />
  <path class="p-mid" d="M 200,20 L 180,0" />
  <circle class="p-dot" cx="200" cy="0" r="2.5" />

  <!-- Bottom-Left Corner (0,200) -->
  <path class="p-base" d="M 0,124 L 76,200" />
  <path class="p-mid" d="M 0,138 L 62,200" />
  <path class="p-inner" d="M 0,152 L 48,200" />
  <path class="p-emerald" d="M 0,166 L 34,200" />
  <path class="p-mid" d="M 0,180 L 20,200" />
  <circle class="p-dot" cx="0" cy="200" r="2.5" />

  <!-- Bottom-Right Corner (200,200) -->
  <path class="p-base" d="M 200,124 L 124,200" />
  <path class="p-mid" d="M 200,138 L 138,200" />
  <path class="p-inner" d="M 200,152 L 152,200" />
  <path class="p-emerald" d="M 200,166 L 166,200" />
  <path class="p-mid" d="M 200,180 L 180,200" />
  <circle class="p-dot" cx="200" cy="200" r="2.5" />

  <!-- ── 3. INTERCONNECTING STEMS & CHEVRONS (North, South, East, West) ── -->
  <!-- North Hub (100, 0..24) -->
  <line class="p-mid" x1="100" y1="0" x2="100" y2="24" />
  <path class="p-sub" d="M 90,0 L 100,10 L 110,0" />
  <path class="p-sub" d="M 82,0 L 100,18 L 118,0" />

  <!-- South Hub (100, 176..200) -->
  <line class="p-mid" x1="100" y1="176" x2="100" y2="200" />
  <path class="p-sub" d="M 90,200 L 100,190 L 110,200" />
  <path class="p-sub" d="M 82,200 L 100,182 L 118,200" />

  <!-- West Hub (0..24, 100) -->
  <line class="p-mid" x1="0" y1="100" x2="24" y2="100" />
  <path class="p-sub" d="M 0,90 L 10,100 L 0,110" />
  <path class="p-sub" d="M 0,82 L 18,100 L 0,118" />

  <!-- East Hub (176..200, 100) -->
  <line class="p-mid" x1="176" y1="100" x2="200" y2="100" />
  <path class="p-sub" d="M 200,90 L 190,100 L 200,110" />
  <path class="p-sub" d="M 200,82 L 182,100 L 200,118" />

  <!-- ── 4. SATELLITE ARABESQUE DIAMONDS (In the 4 corridors) ── -->
  <!-- Top-Left Satellite (50, 50) -->
  <polygon class="p-sub" points="50,36 64,50 50,64 36,50" />
  <polygon class="p-emerald" points="50,42 58,50 50,58 42,50" />
  <circle class="p-dot" cx="50" cy="50" r="1.5" />
  <line class="p-sub" x1="50" y1="26" x2="50" y2="36" />
  <line class="p-sub" x1="50" y1="64" x2="50" y2="74" />
  <line class="p-sub" x1="26" y1="50" x2="36" y2="50" />
  <line class="p-sub" x1="64" y1="50" x2="74" y2="50" />

  <!-- Top-Right Satellite (150, 50) -->
  <polygon class="p-sub" points="150,36 164,50 150,64 136,50" />
  <polygon class="p-emerald" points="150,42 158,50 150,58 142,50" />
  <circle class="p-dot" cx="150" cy="50" r="1.5" />
  <line class="p-sub" x1="150" y1="26" x2="150" y2="36" />
  <line class="p-sub" x1="150" y1="64" x2="150" y2="74" />
  <line class="p-sub" x1="126" y1="50" x2="136" y2="50" />
  <line class="p-sub" x1="164" y1="50" x2="174" y2="50" />

  <!-- Bottom-Left Satellite (50, 150) -->
  <polygon class="p-sub" points="50,136 64,150 50,164 36,150" />
  <polygon class="p-emerald" points="50,142 58,150 50,158 42,150" />
  <circle class="p-dot" cx="50" cy="150" r="1.5" />
  <line class="p-sub" x1="50" y1="126" x2="50" y2="136" />
  <line class="p-sub" x1="50" y1="164" x2="50" y2="174" />
  <line class="p-sub" x1="26" y1="150" x2="36" y2="150" />
  <line class="p-sub" x1="64" y1="150" x2="74" y2="150" />

  <!-- Bottom-Right Satellite (150, 150) -->
  <polygon class="p-sub" points="150,136 164,150 150,164 136,150" />
  <polygon class="p-emerald" points="150,142 158,150 150,158 142,150" />
  <circle class="p-dot" cx="150" cy="150" r="1.5" />
  <line class="p-sub" x1="150" y1="126" x2="150" y2="136" />
  <line class="p-sub" x1="150" y1="164" x2="150" y2="174" />
  <line class="p-sub" x1="126" y1="150" x2="136" y2="150" />
  <line class="p-sub" x1="164" y1="150" x2="174" y2="150" />

  <!-- Stepped connection links between satellites and main diamonds -->
  <path class="p-sub" d="M 64,50 L 75,61 L 86,50" />
  <path class="p-sub" d="M 136,50 L 125,61 L 114,50" />
  <path class="p-sub" d="M 64,150 L 75,139 L 86,150" />
  <path class="p-sub" d="M 136,150 L 125,139 L 114,150" />
</svg>
