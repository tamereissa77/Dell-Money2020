# Quantitative Signal Discovery — GB10, fully local.
#
# Two services:
#   vllm    — NVIDIA Nemotron 3 Nano 30B A3B FP8, OpenAI-compatible on :8000.
#             Same image, weights and flags as /home/delluser26/nemotron3-nano-gb10,
#             which is the deployment validated for DGX Spark (Grace ARM64 + sm_121).
#   phoenix — Arize Phoenix trace viewer on :6006. This is the booth screen: every
#             agent call, its prompt, its output and its latency, live.
#
# The workflow itself runs from .venv on the host (`make run`), not in a container —
# it is a plain Python CLI and containerising it buys nothing here.

services:
  vllm:
    image: ${VLLM_IMAGE}
    container_name: quant-signal-vllm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT}:8000"
    environment:
      HF_HOME: /root/.cache/huggingface
      TORCH_CUDA_ARCH_LIST: ${TORCH_CUDA_ARCH_LIST}
      VLLM_USE_FLASHINFER_MOE_FP8: ${VLLM_USE_FLASHINFER_MOE_FP8}
      VLLM_FLASHINFER_MOE_BACKEND: ${VLLM_FLASHINFER_MOE_BACKEND}
    command:
      - ${MODEL_CONTAINER_DIR}
      - --served-model-name
      - ${SERVED_MODEL_NAME}
      - --dtype
      - ${VLLM_DTYPE}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN}
      - --max-num-seqs
      - ${VLLM_MAX_NUM_SEQS}
      - --tensor-parallel-size
      - "1"
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION}
      - --max-num-batched-tokens
      - ${VLLM_MAX_NUM_BATCHED_TOKENS}
      - --kv-cache-dtype
      - ${VLLM_KV_CACHE_DTYPE}
      - --enable-prefix-caching
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser-plugin
      - ${VLLM_REASONING_PARSER_PLUGIN}
      - --reasoning-parser
      - ${VLLM_REASONING_PARSER}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    shm_size: ${VLLM_SHM_SIZE}
    volumes:
      - ${MODEL_HOST_DIR}:${MODEL_CONTAINER_DIR}:ro
      - ${HF_CACHE_DIR}:/root/.cache/huggingface
      - ../.nvcache-shared:/nvcache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/models"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 300s

  phoenix:
    image: ${PHOENIX_IMAGE}
    container_name: quant-signal-phoenix
    restart: unless-stopped
    ports:
      - "${PHOENIX_PORT}:6006"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - ./traces:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:6006')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
